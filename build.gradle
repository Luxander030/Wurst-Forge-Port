plugins {
	id "dev.architectury.loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.minecraftforge.net/" }
}

// Override vulnerable dependencies until Minecraft updates to newer versions
configurations.all {
	resolutionStrategy {
		force "org.apache.commons:commons-lang3:3.18.0"
	}
}

loom {
	silentMojangMappingsLicense()
	accessWidenerPath = file("src/main/resources/wurst.accesswidener")
	
	forge {
		// Turn wurst.accesswidener into a Forge access transformer
		convertAccessWideners = true
		extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
		mixinConfig "wurst.mixins.json"
	}
	
	runs {
		client {
			client()
			name "Minecraft Client"
			runDir "run"
		}
		// Boots the game and runs Wurst's end-to-end test (creates a world,
		// exercises a bunch of hacks and commands, then quits).
		e2eTest {
			client()
			name "Wurst E2E Test"
			runDir "run"
			vmArg "-Dwurst.e2eTest"
			vmArg "-Dmixin.debug.verify=true"
			vmArg "-Dmixin.debug.countInjections=true"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.forge_version}"
	
	// Wurst uses MixinExtras (@WrapOperation etc.). Forge 1.20.1 doesn't
	// ship it, so bundle it via Jar-in-Jar.
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
	implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))
	
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def modVersion = project.version.substring(1)
	inputs.property("version", modVersion)
	
	filesMatching("META-INF/mods.toml") {
		expand(version: modVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

jar {
	def archivesName = project.base.archivesName
	inputs.property("archivesName", archivesName)
	
	from("LICENSE") {
		rename { "LICENSE-${archivesName.get()}.txt" }
	}
	
	exclude("intentionally_untranslated.json")
	
	manifest {
		attributes("MixinConfigs": "wurst.mixins.json")
	}
}

test {
	useJUnitPlatform()
}
